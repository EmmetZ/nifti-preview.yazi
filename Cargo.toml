[package]
name = "yazi-nifti-preview"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"

[dependencies]
nifti = { version = "0.17", default-features = false, features = ["ndarray_volumes", "nalgebra_affine"] }
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
